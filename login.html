<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CJ Hubs Store</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260816a">
</head>
<body>
<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="sub">Log in with your email and password to view your orders and account details.</p>
    <div class="form-error" id="loginError" style="display:none;text-align:center;margin-bottom:14px;"></div>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button type="submit" class="btn btn-gold btn-block">Login</button>
    </form>
    <div class="auth-switch">Don't have an account? <a href="register.html">Create one</a></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js?v=20260816a"></script>
<script src="assets/js/layout.js?v=20260816a"></script>
<script src="assets/js/app.js?v=20260816a"></script>
<script>
  renderLayout('');
  initLoginPage();
</script>
</body>
</html>
