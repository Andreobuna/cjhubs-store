<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — CJ Hubs Store</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="auth-wrap" style="min-height:100vh;">
  <div class="auth-card">
    <div class="logo" style="justify-content:center;margin-bottom:6px;color:var(--navy);"><span class="mark">CJ</span>Admin Panel</div>
    <p class="sub">Sign in to manage CJ Hubs Store</p>
    <div class="form-error" id="adminLoginError" style="display:none;text-align:center;margin-bottom:14px;"></div>
    <form id="adminLoginForm">
      <div class="form-group"><label>Email</label><input id="adminUsername" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="adminPassword" required></div>
      <button type="submit" class="btn btn-gold btn-block">Login to Dashboard</button>
    </form>
    <p style="text-align:center;font-size:12.5px;color:var(--gray-600);margin-top:16px;">Test admin credentials: <b>admin@cjhubs.com</b> / <b>Adminpass123</b></p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
      <button id="resetAdminBtn" class="btn btn-outline btn-sm">Reset admin credentials (local)</button>
      <a class="btn btn-outline btn-sm" href="../index.html">Back to Store</a>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  initAdminLoginPage();

  // One-click reset for local development: writes the seeded admin credentials into localStorage
  document.getElementById('resetAdminBtn')?.addEventListener('click', () => {
    try {
      const admin = { username: 'admin', email: 'admin@cjhubs.com', password: btoa('Adminpass123'), name: 'Store Admin' };
      localStorage.setItem('cjhubs_admin', JSON.stringify(admin));
      showToast('Admin credentials reset locally. You can now sign in.');
    } catch (e) {
      console.error(e);
      alert('Failed to reset admin credentials: ' + e.message);
    }
  });
</script>
</body>
</html>
