<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product — CJ Hubs Store Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <div class="hamburger" id="adminMenuToggle" style="display:none;"><span></span><span></span><span></span></div>
        <h1 id="formTitle">Add New Product</h1>
      </div>
      <a href="products.html" class="btn btn-outline btn-sm">? Back to Products</a>
    </div>

    <form id="productForm">
  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  initAdminAddProductPage();
  // sync category radio with hidden field & existing value on load
  setTimeout(() => {
    const cat = document.getElementById('fCategory').value;
    document.querySelectorAll('input[name=fCategoryRadio]').forEach(r => r.checked = (r.value === cat));
  }, 50);
</script>
</body>
</html>
