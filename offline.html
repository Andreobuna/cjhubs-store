<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - CJ Hubs Store</title>
<meta name="theme-color" content="#0a1638">
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at top, rgba(212,175,55,.20), transparent 28%),
      linear-gradient(180deg, #050a14 0%, #081629 48%, #0a1638 100%);
    color:#f4f7ff;
  }
  .card{
    width:min(100%, 560px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    background:rgba(6,12,24,.78);
    box-shadow:0 24px 80px rgba(0,0,0,.36);
    padding:32px;
    text-align:center;
    backdrop-filter:blur(18px);
  }
  .mark{width:88px;height:88px;margin:0 auto 20px;border-radius:24px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.3)}
  .mark img{width:100%;height:100%;display:block;object-fit:cover}
  h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(32px, 5vw, 48px);line-height:1.05;margin:0 0 12px;}
  p{margin:0 auto 24px;max-width:44ch;color:rgba(244,247,255,.82);line-height:1.6}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:160px;
    padding:12px 18px;
    border-radius:999px;
    text-decoration:none;
    font-weight:700;
  }
  .primary{background:#d4af37;color:#0a1638}
  .secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.18)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><img src="dot.jpg" alt="CJ Hubs Store"></div>
    <h1>You are offline</h1>
    <p>The app shell is still available, but this page needs a network connection to refresh content that has not been cached yet.</p>
    <div class="actions">
      <a class="primary" href="index.html">Go to home</a>
      <a class="secondary" href="shop.html">Browse shop</a>
    </div>
  </main>
</body>
</html>
